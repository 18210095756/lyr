<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>动物园规则怪谈 · 规则之外（demo）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}
#wrap{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;background:#000}
canvas{width:100%;height:100%;display:block;background:#0c0e12}
#ui{position:absolute;inset:0;pointer-events:none}
.shade{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;background:rgba(0,0,0,.28);animation:shadeIn .45s both}
.card{width:min(780px,90%);max-height:88%;overflow:auto;background:rgba(7,9,11,.94);border:1px solid rgba(215,222,230,.20);color:#d6dae0;padding:26px 30px;box-shadow:0 0 70px rgba(0,0,0,.95),inset 0 0 46px rgba(0,0,0,.55);text-align:left}
.card::-webkit-scrollbar{width:4px}
.card::-webkit-scrollbar-thumb{background:#2a323b}
.kicker{font-size:12px;letter-spacing:.42em;color:#7f8b96;border-bottom:1px solid rgba(215,222,230,.13);padding-bottom:12px;margin-bottom:16px}
.story{font-family:"KaiTi","STKaiti","FangSong","Microsoft YaHei",serif}
.story p{font-size:16.5px;line-height:2.0;color:#c6ccd3;margin-bottom:13px}
.story p.small{font-family:"Microsoft YaHei",sans-serif;font-size:13px;color:#7e8a95;line-height:1.9}
.opts{display:flex;gap:14px;flex-wrap:wrap;margin-top:20px;justify-content:center}
button{pointer-events:auto;background:#0e1217;border:1px solid #37414d;color:#d6dae0;font-size:15px;padding:13px 20px;cursor:pointer;font-family:inherit;letter-spacing:.08em;transition:.18s;width:min(430px,100%)}
button:hover{border-color:#a5b6c7;background:#171e27}
button small{display:block;color:#77838f;font-size:12px;margin-top:7px;line-height:1.7;letter-spacing:.02em;font-weight:normal}
button.ghost{width:auto;background:transparent;border-color:#232b34;font-size:12px;padding:7px 12px;color:#8b959f}
#hud{position:absolute;top:18px;left:24px;font-size:12px;color:#6e7882;letter-spacing:.22em;pointer-events:none;text-shadow:0 0 8px #000;line-height:1.8}
#hud .m{color:#cfd6dd;letter-spacing:.12em}
#hud .d{color:#4c565f}
#sound{position:absolute;top:16px;right:20px;pointer-events:auto}
.prompt{position:absolute;bottom:30px;width:100%;text-align:center;color:#aab3bc;font-size:14px;letter-spacing:.3em;text-shadow:0 0 8px #000;animation:pulse 1.5s infinite}
.toast{position:absolute;bottom:80px;width:100%;text-align:center;color:#c3cbd3;font-size:15px;letter-spacing:.18em;text-shadow:0 0 10px #000;animation:toastUp 2.2s both}
@keyframes pulse{0%,100%{opacity:.32}50%{opacity:1}}
@keyframes shadeIn{from{opacity:0}to{opacity:1}}
@keyframes toastUp{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.tt{font-size:46px;letter-spacing:.24em;color:#e3e8ee;margin:6px 0 22px;font-weight:normal;text-align:center;text-shadow:0 0 24px rgba(200,215,230,.22)}
.tt em{font-style:normal;color:#8c99a5;font-size:15px;letter-spacing:.3em;display:block;margin-top:10px}
.endtitle{font-size:30px;letter-spacing:.3em;color:#e0e5eb;margin-bottom:16px;font-weight:normal}
.mind{font-family:"Microsoft YaHei",sans-serif;font-size:13px;color:#6f7b86;letter-spacing:.14em;text-align:center;margin-top:20px;line-height:1.8}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="1280" height="720"></canvas>
  <div id="ui"></div>
</div>
<div id="err" style="display:none;position:fixed;bottom:8px;left:8px;color:#f88;z-index:99;font-size:12px"></div>
<script>
"use strict";
window.onerror=function(m){var d=document.getElementById("err");if(d){d.style.display="block";d.textContent="JS错误: "+m;}};

var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var ui=document.getElementById("ui");
var VW=1280,VH=720,GY=560,WORLD_W=8800;
var clamp=function(v,a,b){return v<a?a:v>b?b:v;};
var lerp=function(a,b,t){return a+(b-a)*t;};

/* ---------- deterministic random ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function zoneAt(x){if(x<900)return"entrance";if(x<2450)return"elephant";if(x<3900)return"rabbit";if(x<5300)return"plaza";if(x<7000)return"ocean";return"lion";}

/* ---------- audio (procedural, no assets) ---------- */
var AUD={ac:null,master:null,noiseBuf:null,muted:false,started:false,gustT:0,beatT:0};
function ensureAudio(){
  if(AUD.ac){AUD.ac.resume();return;}
  var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  var ac=new AC();AUD.ac=ac;AUD.master=ac.createGain();AUD.master.gain.value=0.7;AUD.master.connect(ac.destination);
  var len=ac.sampleRate*2,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<len;i++)d[i]=Math.random()*2-1;AUD.noiseBuf=buf;
  var mk=function(f,g,type){var o=ac.createOscillator(),n=ac.createGain();o.type=type||"sine";o.frequency.value=f;n.gain.value=g;o.connect(n);n.connect(AUD.master);o.start();return{o:o,n:n};};
  mk(42,0.055);mk(42.7,0.045);mk(84.3,0.014);
  var lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=0.09;lg.gain.value=0.02;lfo.connect(lg);lg.connect(AUD.master.gain);lfo.start();
  var src=ac.createBufferSource();src.buffer=buf;src.loop=true;
  var bp=ac.createBiquadFilter();bp.type="bandpass";bp.frequency.value=260;bp.Q.value=0.8;
  var wg=ac.createGain();wg.gain.value=0.028;
  src.connect(bp);bp.connect(wg);wg.connect(AUD.master);src.start();
  AUD.wind=bp;AUD.windGain=wg;
}
function sfxClick(){if(!AUD.ac)return;var t=AUD.ac.currentTime,o=AUD.ac.createOscillator(),g=AUD.ac.createGain();o.frequency.value=760;g.gain.setValueAtTime(0.05,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.08);o.connect(g);g.connect(AUD.master);o.start(t);o.stop(t+0.1);}
function sfxSting(low){if(!AUD.ac)return;var t=AUD.ac.currentTime;
  [0,1,4].forEach(function(d){var o=AUD.ac.createOscillator(),g=AUD.ac.createGain();o.type="sawtooth";o.frequency.value=150+d*3;g.gain.setValueAtTime(0.001,t);g.gain.exponentialRampToValueAtTime(low?0.11:0.045,t+0.02);g.gain.exponentialRampToValueAtTime(0.001,t+1.5);o.connect(g);g.connect(AUD.master);o.start(t+d*0.02);o.stop(t+1.6);});
  var src=AUD.ac.createBufferSource();src.buffer=AUD.noiseBuf;var f=AUD.ac.createBiquadFilter();f.type="lowpass";f.frequency.value=400;var g2=AUD.ac.createGain();g2.gain.setValueAtTime(low?0.18:0.05,t);g2.gain.exponentialRampToValueAtTime(0.001,t+1.1);src.connect(f);f.connect(g2);g2.connect(AUD.master);src.start(t);src.stop(t+1.2);
}
function sfxBeat(){if(!AUD.ac)return;var t=AUD.ac.currentTime;
  [0,0.14].forEach(function(dd){var o=AUD.ac.createOscillator(),g=AUD.ac.createGain();o.frequency.setValueAtTime(64,t+dd);o.frequency.exponentialRampToValueAtTime(38,t+dd+0.13);g.gain.setValueAtTime(0.16,t+dd);g.gain.exponentialRampToValueAtTime(0.001,t+dd+0.2);o.connect(g);g.connect(AUD.master);o.start(t+dd);o.stop(t+dd+0.22);});
}
function sfxLaugh(){if(!AUD.ac)return;var t=AUD.ac.currentTime;
  for(var i=0;i<5;i++){var o=AUD.ac.createOscillator(),g=AUD.ac.createGain(),st=t+i*0.16;o.type="square";o.frequency.setValueAtTime(190+i*20,st);o.frequency.exponentialRampToValueAtTime(90,st+0.1);g.gain.setValueAtTime(0.0001,st);g.gain.exponentialRampToValueAtTime(0.045,st+0.01);g.gain.exponentialRampToValueAtTime(0.0001,st+0.14);o.connect(g);g.connect(AUD.master);o.start(st);o.stop(st+0.16);}
}
function setMuted(m){AUD.muted=m;if(AUD.master)AUD.master.gain.value=m?0:0.7;var b=document.getElementById("sndbtn");if(b)b.textContent=m?"♪ 静音":"♪ 声音";}

/* ---------- game state ---------- */
var state="title";
var modalOpen=false,score=0,done={},log={},journalEl=null;
var P={x:150,y:GY-46,w:20,h:46,vx:0,vy:0,ground:true,dir:1,run:0,coyote:0,jbuf:0};
var CH={armed:false,active:false,done:false,t:0,rabbit:null};
var cam=0,dieT=0,endK="dawnA",endT=0;
var Keys={l:false,r:false};
var JUMP=-820,GRAV=2300,SPD=285;

var SOLIDS=[];
var FAR=[],BACK=[],OBJ=[],FG=[];

function obj(o){o.p=o.p||2;OBJ.push(o);}
function genWorld(){
  SOLIDS.length=0;FAR.length=0;BACK.length=0;OBJ.length=0;FG.length=0;
  var r;
  /* far layer */
  function farRange(x0,x1,type,step,seed,h0,h1){r=mulberry(seed);for(var x=x0+r()*120;x<x1;x+=step+r()*step*0.7){FAR.push({x:x,type:type,h:h0+r()*(h1-h0)});}}
  farRange(0,900,"forest",300,101,180,260);
  farRange(900,2450,"forest",340,102,170,260);
  r=mulberry(103);FAR.push({x:1180,type:"dome",h:290});FAR.push({x:2060,type:"dome",h:250});
  farRange(2450,3900,"forest",120,104,150,300);
  farRange(3900,5300,"forest",330,105,160,240);
  r=mulberry(106);FAR.push({x:4320,type:"tower",h:300});FAR.push({x:4980,type:"tower",h:260});
  farRange(7000,8800,"mountain",260,107,140,300);
  /* back layer */
  r=mulberry(201);for(var x=80;x<880;x+=170){BACK.push({x:x+r()*80,type:"bush",s:1.1});}
  r=mulberry(202);for(x=2560;x<3860;x+=150){BACK.push({x:x+r()*90,type:"tree",h:140+r()*90});}
  r=mulberry(203);for(x=3950;x<5280;x+=260){BACK.push({x:x,type:"booth",s:1});}
  /* solids / props */
  SOLIDS.push({x:3060,w:90,h:44},{x:3300,w:70,h:56},{x:3540,w:90,h:44});
  obj({kind:"arch",x:22,label:"■■市动物园",p:3});
  obj({kind:"lamp",x:620,on:true});
  obj({kind:"lamp",x:4260,on:true});
  obj({kind:"lamp",x:4910,on:false});
  obj({kind:"lamp",x:3520,on:false});
  obj({kind:"glass",x0:980,x1:2420,p:1});
  obj({kind:"elephant",x:1500,p:1});
  obj({kind:"board",x:1090,label:"大象园区"});
  obj({kind:"dboard",x:1740});
  obj({kind:"crate",x:3060,w:90,h:44});
  obj({kind:"crate",x:3300,w:70,h:56});
  obj({kind:"crate",x:3540,w:90,h:44});
  obj({kind:"arch",x:3885,label:"工作通道"});
  obj({kind:"kiosk",x:4270});
  obj({kind:"rocks",x:7270,w:150,h:55,p:1});
  obj({kind:"rocks",x:7410,w:150,h:55,p:1});
  obj({kind:"rocks",x:7560,w:150,h:55,p:1});
  obj({kind:"rocks",x:7690,w:150,h:55,p:1});
  obj({kind:"lion",x:7290,p:1});
  obj({kind:"lion",x:7430,p:1});
  obj({kind:"lion",x:7580,p:1});
  obj({kind:"lion",x:7720,p:1});
  obj({kind:"lion5",x:8150,p:1});
  obj({kind:"board",x:7090,label:"狮子园区"});
  obj({kind:"gate",x:8520,label:"出口"});
  /* foreground tufts */
  r=mulberry(301);
  var rx=[0,900,2450,3900,7000,8800];
  for(var z=0;z<rx.length-1;z+=1){if(zoneAt(rx[z]+1)==="ocean")continue;var x2=rx[z+1];for(var fx=rx[z]+40;fx<x2-40;fx+=190+r()*120){FG.push({x:fx,s:0.7+r()*0.8});}}
  OBJ.sort(function(a,b){return a.p-b.p;});
}

/* ---------- triggers & story data ---------- */
var TRIGS=[
 {id:"p_map",x:430,r:60,label:"捡起地图碎片"},
 {id:"s_elephant",x:1090,r:70,label:"查看告示"},
 {id:"d_elephant",x:1740,r:70,label:"走近围栏"},
 {id:"p_rabbit",x:2620,r:70,label:"查看守则"},
 {id:"d_vendor",x:4620,r:210,label:"走向饮料店"},
 {id:"p_ocean",x:5460,r:70,label:"查看告示"},
 {id:"p_tank",x:6020,r:80,label:"看向鲸鱼区"},
 {id:"d_mirror",x:6660,r:80,label:"看向水池玻璃"},
 {id:"s_lion",x:7090,r:70,label:"查看守则"},
 {id:"p_lion",x:7520,r:70,label:"捡起纸条"},
 {id:"d_lion",x:8060,r:80,label:"走向铁门"}
];

function popup(cfg){
  return new Promise(function(resolve){
    var sh=document.createElement("div");sh.className="shade";
    var h='<div class="card"><div class="kicker">'+(cfg.kicker||"■■■")+'</div>'+(cfg.big?'<div class="'+cfg.big.cls+'">'+cfg.big.txt+'</div>':"")+'<div class="story">';
    (cfg.paras||[]).forEach(function(p){h+='<p>'+p+'</p>';});
    h+='</div><div class="opts">';
    cfg.opts.forEach(function(o,i){h+='<button data-i="'+i+'">'+o.label+(o.note?"<small>"+o.note+"</small>":"")+'</button>';});
    h+='</div></div>';
    sh.innerHTML=h;ui.appendChild(sh);modalOpen=true;sfxClick();
    Array.prototype.forEach.call(sh.querySelectorAll("button"),function(b){
      b.addEventListener("click",function(){var i=parseInt(b.getAttribute("data-i"),10);sh.remove();modalOpen=false;sfxClick();resolve(i);});
    });
  });
}
function toast(msg){
  var t=document.createElement("div");t.className="toast";t.textContent=msg;ui.appendChild(t);
  setTimeout(function(){t.remove();},2250);
}
function markMind(){var h=document.getElementById("hudmind");if(h){var s="";for(var i=0;i<4;i++)s+=(i<score?"●":"○");h.innerHTML="心智 <span class=\"m\">"+s+"</span><span class=\"d\">  ·  你仍然记得自己是人类</span>";}}

function respawn(){
  P.x=2745;P.y=GY-46;P.vx=0;P.vy=0;P.ground=true;
  CH.armed=false;CH.active=false;CH.t=0;CH.rabbit=null;
  state="play";
}
function die(){
  state="dying";dieT=0;CH.active=false;sfxSting(true);
}
function ending(){
  var lastD=done.d_lion_last;
  if(score>=3)endK=(lastD==="wait")?"dawnA":"dawnB";
  else if(score===2)endK=(lastD==="wait")?"stayBlue":"goBlack";
  else endK="beast";
  state="end";endT=0;sfxSting(score<=1);
  setTimeout(function(){showEnding(lastD);},950);
}
async function activate(t){
  var cfg=STORY[t.id];
  if(!cfg)return;
  ui.innerHTML="";
  if(!done[t.id]){
    done[t.id]=true;
    var i=await popup(cfg);
    log[t.id]={opt:i};
    if(cfg.after)cfg.after(i);
  }else{
    var rec=log[t.id];
    var paras=cfg.paras.slice();
    var opts;
    if(cfg.opts.length>1){
      var lbl=cfg.opts[rec?rec.opt:0].label;
      paras.push("—— 你上次的选择：「"+lbl+"」");
      opts=[{label:"我记得",note:"再次查看这段记录，不会改变任何事情。"}];
    }else opts=cfg.opts;
    await popup({kicker:cfg.kicker,paras:paras,opts:opts});
  }
}
function journalOpen(){
  var ids=Object.keys(log);
  if(!ids.length){toast("你还没有读到任何守则或纸条。");return;}
  var sh=document.createElement("div");sh.className="shade";
  var h='<div class="card"><div class="kicker">守则与纸条 · 已收集 '+ids.length+' 份</div><div class="story" style="margin-bottom:6px"><p style="font-size:14px;color:#77838f">按 Tab 随时翻阅。你会需要它们。</p></div><div class="opts" style="flex-direction:column;align-items:stretch;margin-top:8px">';
  for(var i=0;i<ids.length;i++){
    var c=STORY[ids[i]];
    if(!c)continue;
    var note="";
    if(c.opts.length>1)note="<small>抉择 · "+(done[ids[i]]?"已做出选择":"尚未选择")+"</small>";
    h+='<button data-id="'+ids[i]+'" style="width:100%">'+c.kicker+note+'</button>';
  }
  h+='<button id="jclose" class="ghost" style="align-self:center;width:auto;margin-top:8px">合上</button></div></div>';
  sh.innerHTML=h;
  Array.prototype.forEach.call(sh.querySelectorAll("button[data-id]"),function(b){
    b.addEventListener("click",function(){
      var id=b.getAttribute("data-id");
      sh.remove();modalOpen=false;journalEl=null;
      activate({id:id});
    });
  });
  sh.querySelector("#jclose").addEventListener("click",function(){sh.remove();modalOpen=false;journalEl=null;});
  ui.appendChild(sh);modalOpen=true;journalEl=sh;
}
function showEnding(lastD){
  var out=STORY.end[score>=3?(lastD==="wait"?"dawnA":"dawnB"):(score===2?(lastD==="wait"?"stayBlue":"goBlack"):"beast")];
  var lab=[];
  out.body.forEach(function(p){lab.push('<p>'+p+'</p>');});
  var h='<div class="card" style="text-align:center"><div class="endtitle">'+out.title+'</div><div class="story">'+lab.join("")+'</div>';
  h+='<div class="mind">'+out.mind+'</div><div class="opts"><button id="again">回到门口 · 再走一次</button></div></div>';
  var sh=document.createElement("div");sh.className="shade";sh.innerHTML=h;ui.appendChild(sh);modalOpen=true;
  sh.querySelector("#again").addEventListener("click",function(){sh.remove();modalOpen=false;restart();});
}
function restart(){
  score=0;done={};ui.innerHTML="";
  P.x=150;P.y=GY-46;P.vx=0;P.vy=0;
  CH={armed:false,active:false,done:false,t:0,rabbit:null};
  state="play";dieT=0;endT=0;
  markMind();
}

var STORY={
 "p_map":{kicker:"地图碎片 · 游客守则（摘录）",paras:[
  "「10. 如果您触犯以上任何一条，并发现自己正在迷路状态、和其他熟人走散，请立刻在一刻钟内找到离您最近的饮料店，告知那里穿蓝色工作服的售货员——注意，如果看见穿黑色工作服的售货员，不论对方对您说什么都请假装没听见。他会马上带您到狮子园区的工作通道。」",
  "「14. 狮子园区是安全的。如果您遭遇任何您无法解决的危险事件，也无法求助，请立刻、不择手段、尽一切可能前往狮子园区。」",
  "地图上标着虚线的地方，已经被人撕掉了。你在口袋里找到一张揉皱的纸条，边角写着一—「逃走。活下去。」"
 ],opts:[{label:"收好地图，继续向前"}]},
 "s_elephant":{kicker:"大象园区 · 告示",paras:[
  "「3. 大象是一种体型巨大、有着扇子一般的耳朵、鼻子很长、腿粗得像柱子的生物，而且不是白色的。请确保你在大象园区看见的是且只有大象。」",
  "黄昏把整片园区染成同一层灰。围栏那头，有什么东西在喷气。"
 ],opts:[{label:"继续走"}]},
 "d_elephant":{kicker:"白象",paras:[
  "围栏那头站着一头象。它通体发白——白得几乎要在暮色里亮起来。",

 ],opts:[

  {label:"站在原地，等它转过来看你",note:"它没有转头。很久之后你才意识到——是你在靠近，而它在后退。"}
 ],after:function(i){if(i===0){score++;markMind();toast("你的心跳慢下来。你记得自己是谁。");}else{toast("你忽然很困。");}}},

/* ---------- input ---------- */
var prompts=[];
function onKey(e,down){
  var k=e.key;
  if(k==="ArrowLeft"||k==="a"||k==="A"){Keys.l=down;e.preventDefault();}
  else if(k==="ArrowRight"||k==="d"||k==="D"){Keys.r=down;e.preventDefault();}
  else if((k===" "||k==="ArrowUp"||k==="w"||k==="W")&&down){P.jbuf=0.13;e.preventDefault();}
  else if((k==="e"||k==="E")&&down&&state==="play"&&!modalOpen){
    for(var i=0;i<prompts.length;i++){if(prompts[i].near){activate(prompts[i]);break;}}
  }
  else if((k==="m"||k==="M")&&down){setMuted(!AUD.muted);}
  else if((k==="Tab"||k==="q"||k==="Q")&&down){
    if(journalEl){journalEl.remove();modalOpen=false;journalEl=null;}
    else if(state==="play"&&!modalOpen){journalOpen();}
    e.preventDefault();
  }
}
document.addEventListener("keydown",function(e){onKey(e,true);});
document.addEventListener("keyup",function(e){onKey(e,false);});

}

  '<p>闭园广播已经响过三遍。</p><p>你——今天的最后一位游客——正站在空无一人的园区里。黄昏正在变成黑夜，而你手里的地图被撕掉了最关键的那一块。</p>'+

/* ---------- update ---------- */
function update(dt){
  if(state!=="play"||modalOpen)return;
  /* player physics */
  var dir=(Keys.r?1:0)-(Keys.l?1:0);
  if(dir!==0)P.dir=dir;
  P.vx=dir*SPD;
  var prevGround=P.ground;
  P.x+=P.vx*dt;
  for(var i=0;i<SOLIDS.length;i++){
    var s=SOLIDS[i];
    if(P.x+P.w>s.x&&P.x<s.x+s.w&&P.y+P.h>GY-s.h&&P.y<GY){
      if(P.vx>0)P.x=s.x-P.w;else if(P.vx<0)P.x=s.x+s.w;
      P.vx=0;
    }
  }
  P.coyote=P.ground?0.1:P.coyote-dt;
  P.jbuf-=dt;
  if(P.jbuf>0&&(P.ground||P.coyote>0)){P.vy=JUMP;P.jbuf=0;P.coyote=0;}
  P.vy+=GRAV*dt;P.y+=P.vy*dt;
  var feet=P.y+P.h;
  P.ground=false;
  if(feet>=GY){P.y=GY-P.h;P.vy=0;P.ground=true;}
  for(i=0;i<SOLIDS.length;i++){
    s=SOLIDS[i];
    if(feet>=GY-s.h&&feet-s.h-P.h<=P.y+P.vy*dt+2&&P.x+P.w>s.x+2&&P.x<s.x+s.w-2&&P.vy>=0){
      if(P.y+P.h>=GY-s.h-1&&P.y+P.h<=GY-s.h+16){P.y=GY-s.h-P.h;P.vy=0;P.ground=true;}
    }
  }
  P.run=(P.ground&&Math.abs(P.vx)>1)?P.run+dt*10:0;
  P.x=clamp(P.x,20,WORLD_W-30);
  /* rabbit chase */
  if(CH.armed&&!CH.active&&!CH.done&&P.x>2900){
    CH.active=true;CH.t=0;
    CH.rabbit={x:P.x-170,y:GY-44,w:30,h:44,vy:0,ground:true,spd:298};
    sfxSting(false);
  }
  if(CH.active&&CH.rabbit){
    CH.t+=dt;
    var r=CH.rabbit;
    r.spd=Math.min(314,298+CH.t*3);
    r.x+=r.spd*dt;
    /* rabbit jumps over crates */
    var willHit=false;
    for(i=0;i<SOLIDS.length;i++){s=SOLIDS[i];if(s.x>r.x+8&&s.x<r.x+46&&r.ground){willHit=true;break;}}
    if(willHit&&r.ground){r.vy=JUMP;}
    r.vy+=GRAV*dt;r.y+=r.vy*dt;
    if(r.y+r.h>=GY){r.y=GY-r.h;r.vy=0;r.ground=true;}else r.ground=false;
    if(r.x-P.x<22&&Math.abs((r.y+r.h)-(P.y+P.h))<34){die();}
    if(P.x>3880){CH.active=false;CH.done=true;CH.rabbit=null;sfxLaugh();toast("笑声停在了栅栏后面。");}
  }
  if(P.x>5260&&P.x<5360&&CH.done&&!done.ocean_door){done.ocean_door=true;}
  cam=clamp(P.x-430,0,WORLD_W-VW);
}

    ctx.fillStyle=g;ctx.fillRect(0,0,VW,GY);
    /* stars */
    for(var i=0;i<stars.length;i++){var st=stars[i];ctx.fillStyle="rgba(225,231,238,"+(st.a*(0.5+0.5*Math.sin(t*1.3+st.t)))+")";ctx.fillRect(st.x,st.y,st.s,st.s);}
    /* moon */
    var mg=ctx.createRadialGradient(1010,150,6,1010,150,110);
    mg.addColorStop(0,"rgba(228,234,242,0.16)");mg.addColorStop(1,"rgba(228,234,242,0)");
    ctx.fillStyle=mg;ctx.beginPath();ctx.arc(1010,150,110,0,7);ctx.fill();
    ctx.fillStyle="rgba(232,238,246,0.72)";ctx.beginPath();ctx.arc(1010,150,16,0,7);ctx.fill();
    ctx.fillStyle="rgba(205,214,226,0.25)";ctx.beginPath();ctx.arc(1006,146,4,0,7);ctx.arc(1014,156,3,0,7);ctx.fill();
  }else{
    drawOceanRoom();
  }
  /* FAR */
  if(!oc){
    for(i=0;i<FAR.length;i++){
      var f=FAR[i],sx=f.x-cam*0.2;
      if(sx<-220||sx>VW+220)continue;
      if(f.type==="forest")drawTreeFar(sx,f.h);
      else if(f.type==="dome")drawDome(sx);
      else if(f.type==="tower")drawTower(sx,f.h);
      else if(f.type==="mountain")drawMountain(sx,150,f.h);
    }
  }
  /* BACK */
  for(i=0;i<BACK.length;i++){
    var b=BACK[i],bx=b.x-cam*0.5;
    if(bx<-160||bx>VW+160)continue;
    if(b.type==="tree")drawBackTree(bx,b.h);
    else if(b.type==="bush")drawBush(bx,b.s);
    else if(b.type==="booth")drawBooth(bx);
  }
  drawGround();
  /* OBJ pass 1 (p1) then pass 2+ sorted */
  for(i=0;i<OBJ.length;i++){
    var o=OBJ[i],ox=o.x-cam;
    if(ox<-500||ox>VW+500)continue;
    if(o.kind==="elephant")drawElephant(ox);
    else if(o.kind==="rocks")drawRocks(ox,o.w,o.h);
    else if(o.kind==="lion"&&!CH.fifth)drawLion(ox,false);
    else if(o.kind==="lion5"&&P.x>7950)drawLion(ox,true);
  }
  for(i=0;i<OBJ.length;i++){
    o=OBJ[i];ox=o.x-cam;
    if(ox<-500||ox>VW+500)continue;
    if(o.kind==="arch")drawArch(ox,o.label);
    else if(o.kind==="lamp")drawLamp(ox,o.on);
    else if(o.kind==="board")drawBoard(ox,o.label);
    else if(o.kind==="dboard")drawDBoard(ox);
    else if(o.kind==="crate")drawCrate(ox,o.w,o.h);
    else if(o.kind==="kiosk")drawKiosk(ox);
    else if(o.kind==="gate")drawArch(ox,o.label);
  }
  /* elephant zone glass & fence */
  if(zoneAt(P.x)==="elephant"||P.x>700){
    var gx0=980-cam,gx1=2420-cam;
    if(gx1>-50&&gx0<VW+50){drawGlass(Math.max(gx0,-10),Math.min(gx1,VW+10));}
  }
  for(var fx=Math.max(980,Math.floor(cam/150)*150+150);fx<Math.min(2420,cam+VW+100);fx+=150){drawFencePost(fx-cam);}
  /* ocean tanks & mirror */
  drawTank(5800,"鲸鱼区 · 3D投影",P.x>5360?"elephant":null);
  drawTank(6480,"水母区 · 钟点客房",P.x>5600?"jelly":null);
  drawTank(6680,"",P.x>5900?"mirror":null);
  /* vendors */
  if(P.x>4200&&P.x<5300){
    drawPerson(4520-cam,GY,{hat:true,rim:true,run:0});
    drawPerson(4685-cam,GY,{run:0,eyes:false,rim:false});
  }
  /* player */
  if(state!=="dying"||dieT<0.4)drawPerson(P.x-cam+10,P.y+P.h,{run:P.run,dir:P.dir});
  /* rabbit */
  if(CH.active&&CH.rabbit)drawRabbit(CH.rabbit);
  /* fg tufts */
  if(!oc){for(i=0;i<FG.length;i++){var fx2=FG[i].x-cam*1.04;if(fx2<-40||fx2>VW+40)continue;ctx.fillStyle="#03040a";ctx.beginPath();ctx.moveTo(fx2,GY);ctx.lineTo(fx2+4,GY-8*FG[i].s);ctx.lineTo(fx2+8,GY);ctx.fill();}}
  /* tunnel fades at ocean doors */
  var px=P.x,da=0;
  var dd=[5280,7000];
  for(i=0;i<2;i++){var dist=Math.abs(px-dd[i]);da=Math.max(da,clamp(1-dist/150,0,1));}
  if(da>0){ctx.fillStyle="rgba(0,0,0,"+da*0.96+")";ctx.fillRect(0,0,VW,VH);}
  /* fog + atmosphere */
  var fog=ctx.createLinearGradient(0,GY-130,0,VH);
  fog.addColorStop(0,"rgba(205,212,222,0)");
  fog.addColorStop(0.55,"rgba(205,212,222,0.055)");
  fog.addColorStop(1,"rgba(205,212,222,0.13)");
  ctx.fillStyle=fog;ctx.fillRect(0,GY-130,VW,VH-GY+130);
  if(state==="dying"){var k=clamp(dieT/1.1,0,1);ctx.fillStyle="rgba(235,240,245,"+(0.55*k)+")";ctx.fillRect(0,0,VW,VH);}
  /* vignette & grain */
  ctx.fillStyle=vig;ctx.fillRect(0,0,VW,VH);
  var gx=Math.floor(Math.random()*3)*180,gy=Math.floor(Math.random()*3)*180;
  ctx.globalAlpha=0.85;ctx.drawImage(noiseCv,gx,gy);ctx.globalAlpha=1;
}

/* ---------- dying & ending scene draw ---------- */
function renderEnd(){
  ctx.fillStyle="#05070a";ctx.fillRect(0,0,VW,VH);
  var k=clamp(endT/2,0,1);
  if(endK==="beast"){
    var g=ctx.createLinearGradient(0,0,0,VH);
    g.addColorStop(0,"#07080c");g.addColorStop(1,"#0b0d10");
    ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
    ctx.fillStyle="rgba(228,235,242,0.1)";ctx.beginPath();ctx.arc(640,190,140,0,7);ctx.fill();
    var bx=640,by=560;
    ctx.save();
    if(endT>1.4)ctx.translate(0,Math.sin((endT-1.4)*3)*2);
    ctx.fillStyle="rgba(186,194,204,0.92)";
    ctx.beginPath();ctx.ellipse(bx,by-88,70,48,0,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(bx+58,by-52,26,36,0.3,0,7);ctx.fill();
    ctx.fillRect(bx+24,by-8,30,8);ctx.fillRect(bx+44,by-8,30,8);ctx.fillRect(bx-52,by-8,26,8);ctx.fillRect(bx-32,by-8,26,8);
    ctx.strokeStyle="rgba(186,194,204,0.9)";ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(bx+72,by-30);ctx.quadraticCurveTo(bx+100,by-24,bx+84,by-42);ctx.stroke();
    ctx.fillStyle="rgba(186,194,204,0.9)";ctx.beginPath();ctx.ellipse(bx+70,by-96,26,34,0.12,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(bx+96,by-84,24,30,-0.1,0,7);ctx.fill();
    ctx.fillStyle="rgba(186,194,204,0.85)";ctx.fillRect(bx+64,by-132,6,26);ctx.fillRect(bx+78,by-134,6,26);
    ctx.fillStyle="rgba(8,10,13,0.75)";ctx.beginPath();ctx.arc(bx+88,by-92,1.8,0,7);ctx.fill();
    ctx.restore();
    var gl=ctx.createRadialGradient(640,560,10,640,560,420);
    gl.addColorStop(0,"rgba(230,236,244,0.05)");gl.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=gl;ctx.fillRect(0,0,VW,VH);
  }else if(endK.indexOf("dawn")===0){
    var dg=ctx.createLinearGradient(0,0,0,VH);
    dg.addColorStop(0,"#1a1d21");dg.addColorStop(0.6,"#22262c");dg.addColorStop(1,"#0d0f13");
    ctx.fillStyle=dg;ctx.fillRect(0,0,VW,VH);
    var sg=ctx.createRadialGradient(780,300,6,780,300,240);
    sg.addColorStop(0,"rgba(236,240,246,0.55)");sg.addColorStop(1,"rgba(236,240,246,0)");
    ctx.fillStyle=sg;ctx.beginPath();ctx.arc(780,300,240,0,7);ctx.fill();
    ctx.fillStyle="#05070a";ctx.fillRect(0,500,VW,220);
    drawArch(500-cam*0.2,"");
    drawPerson(Math.min(1180,endT*430+170),550,{run:3,dir:1});
  }else{
    var og=ctx.createLinearGradient(0,0,0,VH);
    og.addColorStop(0,"#0a0e13");og.addColorStop(0.6,"#0d1218");og.addColorStop(1,"#05070b");
    ctx.fillStyle=og;ctx.fillRect(0,0,VW,VH);
    ctx.fillStyle="rgba(160,185,205,0.07)";ctx.fillRect(0,150,VW,2);
    ctx.fillStyle="#04060a";ctx.fillRect(450,300,30,230);ctx.fillRect(790,300,30,230);
    ctx.beginPath();ctx.moveTo(450,300);ctx.quadraticCurveTo(620,230,820,300);ctx.lineTo(820,300);ctx.fill();
    var glow2=ctx.createRadialGradient(620,330,4,620,330,90);
    glow2.addColorStop(0,"rgba(215,230,242,0.12)");glow2.addColorStop(1,"rgba(215,230,242,0)");
    ctx.fillStyle=glow2;ctx.fillRect(530,240,180,180);
    ctx.fillStyle="rgba(240,244,248,0.95)";ctx.fillRect(616,326,2,26);ctx.fillRect(622,326,2,26);
    drawPerson(620,560,{hat:endK==="goBlack"?false:true,eyes:false});
  }
  ctx.fillStyle="rgba(0,0,0,"+clamp(1-k*1.2,0,1)*0.5+")";ctx.fillRect(0,0,VW,VH);
}

/* ---------- loop ---------- */
var last=0;
function frame(now){
  requestAnimationFrame(frame);
  var dt=clamp((now-last)/1000,0,0.05);last=now;
  /* audio */
  if(AUD.ac&&!AUD.muted&&state==="play"){
    AUD.gustT-=dt;
    if(AUD.gustT<=0){AUD.gustT=5+Math.random()*5;if(AUD.windGain)AUD.windGain.gain.setTargetAtTime(0.02+Math.random()*0.05,AUD.ac.currentTime,1.4);if(AUD.wind)AUD.wind.frequency.setTargetAtTime(200+Math.random()*320,AUD.ac.currentTime,1.8);}
    if(CH.active){AUD.beatT-=dt;if(AUD.beatT<=0){sfxBeat();AUD.beatT=Math.max(0.42,0.9-CH.t*0.03);}}
  }
  if(state==="play")update(dt);
  else if(state==="dying"){
    dieT+=dt;
    if(dieT>1.15&&!modalOpen){
      popup({kicker:"守则 · 1",paras:[
       "本园安全措施保障绝对没有问题，动物没有出逃的可能性……因此，如果您看见路边有逃跑的兔子，请立刻带着您的孩子远离并报告工作人员，不要靠近，不要触摸。",
       "——尤其是兔子发现并且开始高速靠近你的时候。"
      ],opts:[{label:"重新回到兔子园区门口"}]}).then(respawn);
    }
  }
  else if(state==="end")endT+=dt;
  if(state==="end")renderEnd();
  else render();
  /* interact prompts */
  if(state==="play"&&!modalOpen){
    prompts=[];
    for(var i=0;i<TRIGS.length;i++){
      var tr=TRIGS[i],near=Math.abs(P.x-tr.x)<tr.r;
      prompts.push({id:tr.id,near:near});
      if(near){
        var pul=0.55+0.45*Math.sin(Date.now()/300);
        var sx=tr.x-cam;
        ctx.strokeStyle="rgba(230,236,244,"+(0.5*pul)+")";ctx.lineWidth=1;
        ctx.beginPath();ctx.arc(sx,GY-84,5+2*pul,0,7);ctx.stroke();
        var pg=document.getElementById("prog");
        if(!pg||pg.textContent!==("E · "+tr.label)){if(pg)pg.remove();promptLine("E · "+tr.label);}
      }
    }
    var pg=document.getElementById("prog");
    if(pg&&!prompts.some(function(x){return x.near;}))pg.remove();
  }else{var pg2=document.getElementById("prog");if(pg2)pg2.remove();}
}

/* ---------- boot ---------- */
genWorld();
hud();
var Q={};
location.search.replace(/[?&]([^=&]+)=([^&]*)/g,function(a,k,v){Q[decodeURIComponent(k)]=decodeURIComponent(v);});
if(Q.end){state="end";endK=Q.end;if(Q.x)P.x=+Q.x||P.x;}
else if(Q.go){state="play";if(Q.x)P.x=clamp(+Q.x,20,WORLD_W-30);if(Q.chase){CH.armed=true;P.x=clamp(P.x,2900,3200);}cam=clamp(P.x-430,0,WORLD_W-VW);}
else showTitle();
requestAnimationFrame(function(now){last=now;requestAnimationFrame(frame);});
</script>
